<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171d26" media="(prefers-color-scheme: dark)">
  <title>Offline · speed-test-rs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Values mirror style/_tokens.scss (this page must work without the app CSS). */
    :root {
      color-scheme: light dark;
      --color-bg: #ffffff;
      --color-surface: #f7f7f7;
      --color-border: #dedede;
      --color-text: #101010;
      --color-text-muted: #6d6b6d;
      --color-brand: #101010;
      --color-brand-hover: #353535;
      --color-on-brand: #ffffff;
      --color-focus: #101010;
      --font-display: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius-lg: 24px;
      --radius-pill: 32px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #171d26;
        --color-surface: #202733;
        --color-border: #323a46;
        --color-text: #ffffff;
        --color-text-muted: #a3a8b1;
        --color-brand: #ffffff;
        --color-brand-hover: #dedede;
        --color-on-brand: #101010;
        --color-focus: #ffffff;
      }
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/inter-latin-var.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/fonts/ibm-plex-mono-latin-500.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      letter-spacing: -0.03em;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      text-align: center;
    }
    svg { width: 56px; height: 56px; display: block; margin: 0 auto 24px; }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.5rem;
      line-height: 1.2;
    }
    p { margin: 0 0 24px; color: var(--color-text-muted); line-height: 1.5; }
    button {
      appearance: none;
      border: 0;
      border-radius: var(--radius-pill);
      padding: 12px 24px;
      background: var(--color-brand);
      color: var(--color-on-brand);
      font: 600 1rem/1 var(--font-body);
      letter-spacing: inherit;
      cursor: pointer;
      transition: background-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover { background: var(--color-brand-hover); }
    button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff7bad"/>
          <stop offset="1" stop-color="#ffba2f"/>
        </linearGradient>
      </defs>
      <circle cx="256" cy="256" r="256" fill="url(#g)"/>
      <g fill="none" stroke="#101010" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
        <path d="M190 150V346M134 290L190 346L246 290"/>
        <path d="M322 362V166M266 222L322 166L378 222"/>
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>Can't reach the speed-test server on this network. Check that you're on the same network as the server and that it's running.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
