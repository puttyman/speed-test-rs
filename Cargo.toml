[package]
name = "speed-test-rs"
version = "0.1.0"
edition = "2024"
description = "Self-hosted, Cloudflare-style network speed test for your LAN, built with Leptos and Axum"
license = "MIT OR Apache-2.0"
repository = "https://github.com/puttyman/speed-test-rs"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2" }
# Browser measurement engine (`hydrate` only)
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
js-sys = { version = "0.3" }
wasm-bindgen-futures = { version = "0.4", optional = true }
# Also used (unconditionally, to avoid cfg noise) by the UI components; Leptos already
# compiles both for the server.
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Blob",
    "CloseEvent",
    "CanvasRenderingContext2d",
    "console",
    "Crypto",
    "CssStyleDeclaration",
    "CustomEvent",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "ErrorEvent",
    "EventTarget",
    "Event",
    "Headers",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Performance",
    "PerformanceEntry",
    "PerformanceResourceTiming",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Response",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceGatheringState",
    "RtcPeerConnection",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "Storage",
    "WebSocket",
    "Window",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
send_wrapper = "0.6"
uuid = { version = "1.28", features = ["serde"] }

# Server-only dependencies
axum = { version = "0.8", features = ["ws"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
async-trait = { version = "0.1.92", optional = true }
bytes = { version = "1.12", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"], optional = true }
rand = { version = "0.10", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
directories = { version = "6", optional = true }
gethostname = { version = "1.1", optional = true }
if-addrs = { version = "0.15", optional = true }
leptos_axum = { version = "0.8", optional = true }
mime_guess = { version = "2", optional = true }
open = { version = "5.4", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
rust-embed = { version = "8.13", features = ["interpolate-folder-path"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
socket2 = { version = "0.6", optional = true }
# WebRTC packet-loss echo endpoint (SPEC §5.7). aws-lc-rs is str0m's default provider; dimpl
# (str0m's DTLS) pulls aws-lc-rs in for certificate generation with every provider anyway.
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"], optional = true }
# Bundled SQLite (compiled in, no system libsqlite3). Runtime-checked queries only, so no
# DATABASE_URL is needed at build time.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[build-dependencies]
# Only used when `embed-assets` is on: pre-compress the site before embedding it.
brotli = { version = "9", optional = true }
flate2 = { version = "1.1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:futures",
    "dep:wasm-bindgen-futures",
    "uuid/v4",
    "uuid/v7",
    "uuid/js",
]
ssr = [
    "dep:axum",
    "dep:axum-server",
    "dep:async-trait",
    "dep:bytes",
    "dep:futures-util",
    "dep:rand",
    "dep:clap",
    "dep:directories",
    "dep:gethostname",
    "dep:if-addrs",
    "dep:leptos_axum",
    "dep:mime_guess",
    "dep:open",
    "dep:qrcode",
    "dep:rustls",
    "dep:socket2",
    "dep:str0m",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "uuid/v4",
    "uuid/v7",
]
# Compile the cargo-leptos site output (target/site) into the server binary so it runs
# without any files next to it (docs/SPEC.md §10.1). Build the site first:
#   cargo leptos build --release
#   cargo build --release --no-default-features --features ssr,embed-assets
embed-assets = ["ssr", "dep:rust-embed", "dep:brotli", "dep:flate2"]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "speed-test-rs"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
site-pkg-dir = "pkg"

# The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS.
style-file = "style/main.scss"

# Assets source dir. All files found here will be copied and synchronized to site-root.
assets-dir = "public"

# The IP and port where the server serves the content. Override with LEPTOS_SITE_ADDR (the Docker image uses 0.0.0.0:8080).
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# Command to use when running end2end tests. It will run in the end2end dir.
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The features to use when compiling the bin target
bin-features = ["ssr"]
bin-default-features = false

# The features to use when compiling the lib target
lib-features = ["hydrate"]
lib-default-features = false

# The profile to use for the lib target when compiling for release
lib-profile-release = "wasm-release"
