version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      leptos:
        patterns: ["leptos*"]
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /end2end
    schedule:
      interval: weekly

  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/"]
    schedule:
      interval: weekly
