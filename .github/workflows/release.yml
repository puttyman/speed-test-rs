# Release pipeline (SPEC §10.1): prepare -> ci -> site -> binaries -> docker -> publish.
#
# Start it either way:
# - push a tag `vX.Y.Z`, or
# - Actions -> Release -> Run workflow, with version `X.Y.Z`: the tag `vX.Y.Z` is created on
#   the selected branch's commit when the release is published.
#
# 0. prepare:  resolve the version and tag, check it matches Cargo.toml.
# 0. ci:       the full CI suite (fmt, clippy, unit/integration tests, Playwright e2e in
#              Chromium/Firefox/WebKit, musl build + smoke). Nothing is built if it fails.
# 1. site:     build the WASM/JS/CSS front end once and upload target/site.
# 2. binaries: build the server for every target with that site embedded (embed-assets),
#              smoke-test where the runner can execute the binary, package the archive.
# 3. docker:   multi-arch image (amd64, arm64) from the same musl binaries -> GHCR, and
#              Docker Hub (puttyman/speed-test-rs) when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are set.
# 4. publish:  SHA256SUMS + GitHub Release with every archive and generated notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match Cargo.toml), e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_LEPTOS_VERSION: "0.3.11"
  # Zig is the C compiler/linker for the static musl builds (cargo-zigbuild); it also builds
  # the bundled C code (SQLite, and aws-lc for str0m's DTLS). Versions verified together.
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  LEPTOS_OUTPUT_NAME: speed-test-rs

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$crate" != "$version" ]; then
            echo "::error::Version $version does not match Cargo.toml ($crate). Bump Cargo.toml first."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists."; exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $GITHUB_SHA (prerelease: $prerelease)"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  site:
    name: Build site
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Install cargo-leptos
        run: |
          curl -fsSL "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/.cargo/bin" cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos
          cargo leptos --version
      - name: cargo leptos build --release (front end only)
        run: cargo leptos build --release --frontend-only --cargo-locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/site
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build ${{ matrix.target }}
    needs: [prepare, site]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # C code in the build: SQLite (bundled) and aws-lc (str0m's DTLS, via aws-lc-sys's
      # cc builder; no cmake, NASM or bindgen needed for these targets):
      # - Linux musl: cargo-zigbuild, with Zig as the C cross compiler and linker.
      # - macOS: the runner's Xcode clang (x86_64 is cross-compiled with `-arch x86_64`).
      # - Windows: MSVC from the runner image; aws-lc uses its bundled pre-assembled NASM
      #   objects (str0m-aws-lc-rs enables aws-lc-rs's `prebuilt-nasm`), so no NASM install.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            # Native arm64 runner, so the smoke test can execute the binary.
            os: ubuntu-24.04-arm
            zigbuild: true
            smoke: true
          - target: armv7-unknown-linux-musleabihf
            # Smoke-tested under qemu-user (binfmt), which is slow but enough for the checks.
            os: ubuntu-latest
            zigbuild: true
            smoke: true
            qemu: true
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
            smoke: true
          - target: x86_64-apple-darwin
            # Cross-compiled on the arm64 macOS runner; not executable there without Rosetta.
            os: macos-latest
            zigbuild: false
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
            smoke: true
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site
      - name: Build server with embedded site
        run: |
          build=build
          if [ "${{ matrix.zigbuild }}" = "true" ]; then build=zigbuild; fi
          cargo "$build" --locked --release --no-default-features --features ssr,embed-assets --target "$TARGET"
      - name: Locate binary
        run: |
          exe=speed-test-rs
          if [ "${RUNNER_OS}" = "Windows" ]; then exe=speed-test-rs.exe; fi
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "BIN=target/$TARGET/release/$exe" >> "$GITHUB_ENV"
      - name: Install QEMU user emulation
        if: matrix.qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Smoke test
        if: matrix.smoke
        run: bash scripts/smoke-binary.sh "$BIN"
      - name: Package
        run: |
          name="speed-test-rs-${VERSION}-${TARGET}"
          mkdir -p "staging/$name" dist
          cp "$BIN" "staging/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "staging/$name/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
          else
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image (Docker Hub, GHCR)
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub publishing is on when the repository has these secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: docker.io/puttyman/speed-test-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Download musl archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-unknown-linux-musl
          path: archives
          merge-multiple: true
      - name: Lay out binaries per Docker TARGETARCH
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch="${pair%%:*}"; target="${pair#*:}"
            name="speed-test-rs-${VERSION}-${target}"
            mkdir -p "dist/$arch"
            tar -xzf "archives/$name.tar.gz" -C "dist/$arch" --strip-components=1 "$name/speed-test-rs"
            chmod 0755 "dist/$arch/speed-test-rs"
          done
          ls -lR dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Hub skipped
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are not set; pushing to GHCR only."
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Creates the tag on this commit when the run was started by hand.
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: speed-test-rs ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
