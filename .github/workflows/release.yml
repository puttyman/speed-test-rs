# Release pipeline (SPEC §10.1): site -> binaries -> docker -> publish.
#
# 1. site:     build the WASM/JS/CSS front end once and upload target/site.
# 2. binaries: build the server for every target with that site embedded (embed-assets),
#              smoke-test where the runner can execute the binary, package the archive.
# 3. docker:   multi-arch image (amd64, arm64) from the same musl binaries -> GHCR.
# 4. publish:  SHA256SUMS + GitHub Release with every archive and generated notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_LEPTOS_VERSION: "0.3.11"
  # Zig is the C compiler/linker for the static musl builds (cargo-zigbuild); it also builds
  # the bundled C code (SQLite, and aws-lc for str0m's DTLS). Versions verified together.
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  LEPTOS_OUTPUT_NAME: speed-test-rs

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Install cargo-leptos
        run: |
          curl -fsSL "https://github.com/leptos-rs/cargo-leptos/releases/download/v${CARGO_LEPTOS_VERSION}/cargo-leptos-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/.cargo/bin" cargo-leptos-x86_64-unknown-linux-gnu/cargo-leptos
          cargo leptos --version
      - name: cargo leptos build --release (front end only)
        run: cargo leptos build --release --frontend-only --cargo-locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/site
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build ${{ matrix.target }}
    needs: site
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # C code in the build: SQLite (bundled) and aws-lc (str0m's DTLS, via aws-lc-sys's
      # cc builder; no cmake, NASM or bindgen needed for these targets):
      # - Linux musl: cargo-zigbuild, with Zig as the C cross compiler and linker.
      # - macOS: the runner's Xcode clang (x86_64 is cross-compiled with `-arch x86_64`).
      # - Windows: MSVC from the runner image; aws-lc uses its bundled pre-assembled NASM
      #   objects (str0m-aws-lc-rs enables aws-lc-rs's `prebuilt-nasm`), so no NASM install.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            # Native arm64 runner, so the smoke test can execute the binary.
            os: ubuntu-24.04-arm
            zigbuild: true
            smoke: true
          - target: armv7-unknown-linux-musleabihf
            # Smoke-tested under qemu-user (binfmt), which is slow but enough for the checks.
            os: ubuntu-latest
            zigbuild: true
            smoke: true
            qemu: true
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
            smoke: true
          - target: x86_64-apple-darwin
            # Cross-compiled on the arm64 macOS runner; not executable there without Rosetta.
            os: macos-latest
            zigbuild: false
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
            smoke: true
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site
      - name: Build server with embedded site
        run: |
          build=build
          if [ "${{ matrix.zigbuild }}" = "true" ]; then build=zigbuild; fi
          cargo "$build" --locked --release --no-default-features --features ssr,embed-assets --target "$TARGET"
      - name: Locate binary
        run: |
          exe=speed-test-rs
          if [ "${RUNNER_OS}" = "Windows" ]; then exe=speed-test-rs.exe; fi
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "BIN=target/$TARGET/release/$exe" >> "$GITHUB_ENV"
      - name: Install QEMU user emulation
        if: matrix.qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Smoke test
        if: matrix.smoke
        run: bash scripts/smoke-binary.sh "$BIN"
      - name: Package
        run: |
          name="speed-test-rs-${VERSION}-${TARGET}"
          mkdir -p "staging/$name" dist
          cp "$BIN" "staging/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "staging/$name/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
          else
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image (GHCR)
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download musl archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-unknown-linux-musl
          path: archives
          merge-multiple: true
      - name: Lay out binaries per Docker TARGETARCH
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch="${pair%%:*}"; target="${pair#*:}"
            name="speed-test-rs-${VERSION}-${target}"
            mkdir -p "dist/$arch"
            tar -xzf "archives/$name.tar.gz" -C "dist/$arch" --strip-components=1 "$name/speed-test-rs"
            chmod 0755 "dist/$arch/speed-test-rs"
          done
          ls -lR dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish GitHub Release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
